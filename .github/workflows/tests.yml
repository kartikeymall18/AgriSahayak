name: Source checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source and deterministic smoke checks
        run: python -m unittest discover -s tests -v
      - name: Scan staged files for secrets and private artifacts
        run: python scripts/privacy_audit.py

